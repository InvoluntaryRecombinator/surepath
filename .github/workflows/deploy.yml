# GitHub Pages deployment — builds on every push to main and publishes dist/.
#
# Serving is STATIC ONLY: /api/narrative (the AI assistant, a Vercel function) does not
# run here — the app fails closed to its manual writing path by design. Everything else
# (forms, packet generation, PDFs) is client-side and fully functional.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA routing: Pages has no server, so deep links like /texas/apply would 404.
      # Serving index.html as the 404 page lets the client router handle them.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
